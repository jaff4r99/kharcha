<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha · household ledger</title>
<meta name="theme-color" content="#1d4a40">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kharcha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&family=Inter:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3ebdd; --bg2:#eadfcc; --card:#fffbf4; --card2:#f8f1e5; --ink:#27211b; --ink2:#5a4f44; --muted:#8c7f70;
  --line:rgba(39,33,27,.10); --line2:rgba(39,33,27,.18);
  --pine:#1d4a40; --pine2:#14362f; --pine3:#2b6155; --saffron:#d6a034; --gold:#b9892e; --gold2:#e8c477;
  --terra:#b8573b; --rose:#c98275; --sage:#87a083; --plum:#5d3d58; --sky:#3e6b88; --clay:#c47a52;
  --good:#2f6b52; --bad:#b0442f; --warn:#c98a1c;
  /* aliases kept for page code */
  --sheet:var(--card); --green:var(--good); --red:var(--bad); --indigo:var(--sky); --cover:var(--pine);
  --shadow:0 1px 2px rgba(70,45,20,.06), 0 10px 28px -16px rgba(70,45,20,.38);
  --shadow2:0 2px 4px rgba(70,45,20,.08), 0 18px 40px -18px rgba(70,45,20,.5);
  --r:18px;
  --display:'Fraunces', Georgia, serif;
  --text:'Source Serif 4', Georgia, serif;
  --ui:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fell:var(--display); --sc:var(--ui); --serif:var(--text);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  margin:0; color:var(--ink); font-family:var(--text); font-size:17px; line-height:1.5;
  font-variant-numeric:lining-nums tabular-nums; min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 520px at 85% -10%, rgba(214,160,52,.16), transparent 60%),
    radial-gradient(900px 600px at -10% 30%, rgba(29,74,64,.07), transparent 60%),
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .05 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-attachment:fixed;
}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.01em;font-optical-sizing:auto}
button{font-family:inherit}
a{color:var(--pine3)}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hidden{display:none!important}

/* ---------- header ---------- */
.cover{
  color:#f6ecd8; position:sticky; top:0; z-index:30;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  background-color:var(--pine);
  background-image:
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 44 44'%3E%3Cg fill='none' stroke='%23e8c477' stroke-opacity='.10' stroke-width='1'%3E%3Cpath d='M22 4l5 13 13 5-13 5-5 13-5-13-13-5 13-5z'/%3E%3Crect x='14' y='14' width='16' height='16' transform='rotate(45 22 22)'/%3E%3C/g%3E%3C/svg%3E"),
    linear-gradient(180deg,#22564a,#173d35);
  box-shadow:0 1px 0 rgba(232,196,119,.55), 0 10px 24px -14px rgba(10,30,25,.7);
}
.cover-inner{max-width:1180px;margin:0 auto;padding:14px 22px 6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.brand h1{font-size:30px;line-height:1;color:#fbf1dc;font-weight:600;letter-spacing:-.02em}
.brand .urdu{font-family:'Noto Nastaliq Urdu',serif;font-size:19px;color:var(--gold2);line-height:1.2;margin-top:-4px}
.brand .sub{font-family:var(--text);font-style:italic;font-size:14px;opacity:.75;white-space:nowrap}
.brand-txt{display:flex;flex-direction:column}
.brand-top{display:flex;align-items:baseline;gap:10px}
.today{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid rgba(232,196,119,.35);border-radius:999px;font-family:var(--ui);font-size:13px;font-weight:500;background:rgba(255,255,255,.06);white-space:nowrap}
.pill b{color:var(--gold2);font-weight:700}
.pill .short{display:none}
.pill.alert{background:#fbeedd;color:var(--bad);border-color:#fbeedd;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,90%,100%{transform:none}93%{transform:rotate(-3deg)}96%{transform:rotate(3deg)}}
.head-actions{display:flex;gap:6px;align-items:center}
.hbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(232,196,119,.4);background:rgba(255,255,255,.07);color:#f6ecd8;font-size:17px;cursor:pointer;display:grid;place-items:center}
.hbtn:hover{background:rgba(255,255,255,.14)}
.hbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--saffron);color:var(--pine2);font-family:var(--ui);font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.bulb.lit{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(232,196,119,.18),0 0 18px rgba(232,196,119,.55)}}
.syncdot{width:9px;height:9px;border-radius:50%;background:#a99b86;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.syncdot.ok{background:#8fd3a2}.syncdot.syncing{background:var(--gold2);animation:blink 1s infinite}.syncdot.error{background:#ff8a75}
@keyframes blink{50%{opacity:.3}}

.tabs{max-width:1180px;margin:0 auto;padding:8px 18px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;color:rgba(246,236,216,.75);font-family:var(--ui);font-weight:600;font-size:13.5px;letter-spacing:.01em;padding:9px 14px 11px;border-radius:12px 12px 0 0;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;position:relative}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab.on{background:var(--bg);color:var(--pine)}
.tab .ti{font-size:15px}
.bottomnav{display:none}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:24px 22px 110px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:grid;gap:18px;align-content:start}
section{margin-bottom:18px}
.section-title{font-size:24px;margin:32px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-title small{font-family:var(--text);font-weight:400;font-style:italic;font-size:15px;color:var(--muted);letter-spacing:0}
.section-title::after{content:'';flex:1;border-bottom:1px solid var(--line2);min-width:40px;transform:translateY(-6px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;position:relative;min-width:0}
.card.click{cursor:pointer;transition:transform .18s, box-shadow .18s}
.card.click:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.card.click:active{transform:scale(.99)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:22px}
.card-head .sp{flex:1}
.eyebrow{font-family:var(--ui);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-size:11.5px}
.label{font-family:var(--ui);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-size:11px}
.bignum{font-family:var(--display);font-weight:600;font-size:clamp(46px,7vw,72px);line-height:1;margin:4px 0;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.midnum{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.smallnum{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em}

/* hero */
.hero{overflow:hidden;background:linear-gradient(160deg,#fffdf8,#fbf3e5)}
.hero::before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(214,160,52,.18),transparent 70%)}
.hero-row{display:flex;gap:14px;align-items:center;margin:8px 0 6px;position:relative}
.hero-fig{width:160px;flex:none}
.hero-fig svg{width:100%;height:auto;display:block}
.mood-cap{font-family:var(--text);font-style:italic;font-size:18px;color:var(--ink2)}
.daybar{display:flex;align-items:center;gap:10px;font-family:var(--ui);font-size:12.5px;color:var(--muted);margin:8px 0 4px}
.daybar .bar{flex:1}

/* ledger lines */
.ledger{margin:14px 0 0;padding:6px 0 0}
.ll{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.ll dt{flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ll .lead{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-4px)}
.ll dd{margin:0;font-weight:500}
.ll.dim{color:var(--muted)}
.ledger-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--ink);margin-top:8px;padding-top:10px;font-family:var(--display);font-weight:600;font-size:21px}
.ledger-total dd{margin:0}

/* bars */
.bar{position:relative;height:10px;border-radius:999px;overflow:hidden;background:var(--bg2)}
.bar.thin{height:6px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--good);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)} .bar>i.gold{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar .pace{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7}
.bar-legend{display:flex;justify-content:space-between;font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:6px}

/* buttons, chips */
.btn{font-family:var(--ui);font-weight:600;font-size:14px;padding:9px 16px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(70,45,20,.08);transition:transform .1s, background .15s;white-space:nowrap}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pine);color:#fbf1dc;border-color:var(--pine)}
.btn.primary:hover{background:var(--pine3)}
.btn.red{background:var(--terra);color:#fff7ea;border-color:var(--terra)}
.btn.gold{background:var(--saffron);color:var(--pine2);border-color:var(--saffron)}
.btn.danger{color:var(--bad);border-color:rgba(176,68,47,.4)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;color:var(--ink2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{border:none;background:none;cursor:pointer;font-size:15px;padding:6px 7px;border-radius:10px;color:var(--ink2)}
.ibtn:hover{background:rgba(39,33,27,.06)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--line2);border-radius:999px;background:var(--card);cursor:pointer;font-family:var(--ui);font-weight:500;font-size:13px;user-select:none;color:var(--ink);position:relative}
.chip:hover{border-color:var(--ink2)}
.chip.on,.chip:has(input:checked){background:var(--pine);color:#fbf1dc;border-color:var(--pine)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip small{opacity:.6;font-weight:500}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;padding:5px 12px;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:12.5px;color:var(--ink2);border-radius:999px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(70,45,20,.15)}

.stamp{display:inline-block;font-family:var(--ui);font-weight:700;color:var(--good);border:1.5px solid var(--good);padding:1px 7px;transform:rotate(-5deg);font-size:10.5px;letter-spacing:.12em;border-radius:6px;line-height:1.5;text-transform:uppercase;background:rgba(47,107,82,.06)}
.paidbtn{border:1px dashed var(--line2);background:transparent;border-radius:8px;cursor:pointer;font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:3px 8px;min-width:58px}
.paidbtn:hover{border-color:var(--ink2);color:var(--ink)}
.paidbtn.done{border:none;padding:0}
.tag{display:inline-block;font-family:var(--ui);font-weight:600;font-size:10.5px;letter-spacing:.04em;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap;background:rgba(39,33,27,.06);color:var(--ink2)}
.tag.chain{color:var(--sky);background:rgba(62,107,136,.1)} .tag.up{color:var(--bad);background:rgba(176,68,47,.09)} .tag.end{color:var(--gold);background:rgba(185,137,46,.12)} .tag.paused{color:var(--muted)}
.tag.cat{margin-left:0}
.bank{display:inline-flex;align-items:center;gap:4px;border:none;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:.05em;padding:2px 8px;border-radius:999px;vertical-align:2px;margin-left:6px}
.bank.main{background:#e3ecf5;color:#1f4f7a}
.bank.spend{background:#ece4f6;color:#5b3d8a}

/* stats */
.stat .midnum{margin-top:6px}
.stat .muted{font-size:14.5px}

/* section cards */
.sec{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.sec .emo{font-size:28px;line-height:1}
.sec h3{font-size:19px}
.sec .sec-amt{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em}
.sec .corner{position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--saffron));opacity:.14}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.5fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{font-weight:600}
.row .sch{font-size:14.5px;color:var(--ink2)}
.row .amt{font-family:var(--display);font-weight:600;font-size:18px;text-align:right;white-space:nowrap}
.row .act{display:flex;gap:2px;justify-content:flex-end}
.row.off{opacity:.5}
.rowsimple{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rowsimple:last-child{border-bottom:none}
.rowsimple .grow{flex:1;min-width:0}
.rowsimple .amt{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap}
.datebox{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--card2);border:1px solid var(--line);line-height:1.05;padding:5px 0}
.datebox b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.datebox span{font-family:var(--ui);font-weight:600;font-size:10px;color:var(--terra);letter-spacing:.08em;text-transform:uppercase}
.soon{color:var(--bad);font-weight:600}

/* reminders */
.reminders{display:grid;gap:10px;margin-bottom:18px}
.rem{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#fff6e3,#fffbf3);border:1px solid rgba(214,160,52,.35);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);animation:slidein .5s both}
.rem.hot{background:linear-gradient(90deg,#fdece3,#fffaf4);border-color:rgba(184,87,59,.35)}
.rem .ri{font-size:24px}
.rem .grow{flex:1;min-width:0}
.rem small{color:var(--ink2)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}

/* payday plan */
.plan{background:linear-gradient(150deg,#1f4f44,#163a32);color:#f6ecd8;border:none;overflow:hidden}
.plan::after{content:'';position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(232,196,119,.25),transparent 70%)}
.plan .eyebrow{color:var(--gold2)}
.plan .muted{color:rgba(246,236,216,.7)}
.plan .midnum,.plan .bignum{color:#fff}
.flow{display:flex;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.acct{flex:1;min-width:120px;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(232,196,119,.25)}
.acct .label{color:rgba(246,236,216,.75)}
.acct .smallnum{color:#fff}
.arrow{font-size:22px;color:var(--gold2)}
.steps{counter-reset:s;display:grid;gap:10px;margin:8px 0}
.step{display:flex;gap:12px;align-items:flex-start}
.step::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--pine);color:var(--gold2);font-family:var(--ui);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:2px}
.planbox{border-radius:14px;background:var(--card2);border:1px solid var(--line);padding:4px 14px;margin:6px 0 4px}
.bigsend{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;color:var(--pine);line-height:1}

/* kitchen */
.jar-wrap{width:150px;flex:none}
.jar-wrap.small{width:92px}
.jar-wrap svg{width:100%;height:auto;display:block}
.km-row{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.amount-in{font-family:var(--display);font-weight:600;font-size:40px;width:100%;border:none;border-bottom:2px solid var(--line2);background:transparent;padding:2px 0 2px 28px;color:var(--ink);outline:none;border-radius:0}
.amount-in:focus{border-bottom-color:var(--pine)}
.amount-wrap{position:relative}
.amount-wrap::before{content:'€';position:absolute;left:0;bottom:10px;font-family:var(--display);font-size:28px;color:var(--muted)}
.kform{display:grid;gap:14px}
.kform .r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:190px;height:190px;flex:none}
.legend{flex:1;min-width:180px;display:grid;gap:6px}
.legend div{display:flex;gap:8px;align-items:center;font-size:15px}
.legend i{width:11px;height:11px;border-radius:4px;flex:none}
.legend .lv{margin-left:auto;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.legend .lp{color:var(--muted);width:40px;text-align:right;font-family:var(--ui);font-size:12px}
.legend small{color:var(--muted);font-size:12.5px}
.daygroup{font-family:var(--ui);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin:16px 0 2px;display:flex;justify-content:space-between}
.cyclenav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cyclenav h2{font-size:26px}
.cyclenav .muted{font-style:italic}

/* money */
.gullak-wrap{width:140px;flex:none}
.egg-wrap{width:120px;flex:none}
.egg-wrap.small{width:60px}
.gullak-wrap svg,.egg-wrap svg{width:100%;height:auto;display:block}

/* history */
.chart svg{width:100%;height:auto;display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-family:var(--ui);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:right;padding:8px;border-bottom:1.5px solid var(--ink)}
.tbl th:first-child,.tbl td:first-child{text-align:left}

/* modal */
#modal-root{position:fixed;inset:0;z-index:60;display:none}

/* toasts */
#toasts{position:fixed;right:18px;top:96px;z-index:70;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--pine2);color:#f6ecd8;padding:12px 15px;border-radius:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);display:flex;gap:10px;align-items:flex-start;animation:toastin .3s both;font-size:15px}

@keyframes toastout{to{opacity:0;transform:translateY(-10px)}}

/* overlay celebrations */

/* jar */
.pot-bg{fill:#f4e6cc}

.wave{animation:wave 3.2s linear infinite}
@keyframes wave{to{transform:translateX(60px)}}
.crack{fill:none;stroke:var(--ink);stroke-width:2}
.fly{animation:fly 2.4s ease-in-out infinite}
@keyframes fly{0%{transform:translate(20px,30px)}25%{transform:translate(90px,20px)}50%{transform:translate(70px,50px)}75%{transform:translate(30px,12px)}100%{transform:translate(20px,30px)}}

/* gullak + egg */
.dropcoin{animation:dropc 2.8s ease-in infinite}
@keyframes dropc{0%{transform:translateY(-8px);opacity:0}18%{opacity:1}55%{transform:translateY(30px);opacity:1}56%,100%{transform:translateY(30px);opacity:0}}
.shell{fill:#f9f1e1;stroke:var(--ink);stroke-width:3}

.link{fill:none;stroke:#6d6d6d;stroke-width:3.2;animation:burst 1s 1.15s cubic-bezier(.2,.7,.3,1) forwards}

.free{font-family:var(--display);font-weight:700;font-size:34px;fill:var(--terra);opacity:0;animation:stampin .35s 1.35s forwards;transform-box:fill-box;transform-origin:50% 50%}

.ink .eye{fill:var(--ink);stroke:none}

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function upcoming(from, to) {
  const out = [];
  for (const it of S.items) for (const d of occ(it, from, to)) if (d) { const ck = cycleFor(d).key, pid = it.id + '@' + d; out.push({ date: d, name: it.name, amount: -(+it.amount || 0), ck, pid, paid: !!(S.paid[ck] || {})[pid], kind: 'bill', it }); }
  for (const i of S.incomes) { if (i.kind === 'owed') { if (!i.received && i.date && i.date >= from && i.date <= to) out.push({ date: i.date, name: `${i.name} (owed)`, amount: +i.amount, kind: 'income' }); continue; }
    for (const d of occ(i, from, to)) if (d) out.push({ date: d, name: i.name, amount: +i.amount, kind: 'income' }); }

}

const DEFAULT_CATS = [['Groceries', 1], ['Takeout', 1], ['Eating out', 1], ['Household', 0], ['Baby', 0], ['Transport', 0], ['Fun & games', 0], ['Online shopping', 0], ['Post & shipping', 0], ['Health', 0], ['Clothes', 0], ['Gifts & family', 0], ['Other', 0]];
const DEFAULT_SHOPS = [
  ['Lidl', '', 'Groceries'], ['Rewe', '', 'Groceries'], ['Aldi', '', 'Groceries'], ['Edeka', '', 'Groceries'], ['Penny', '', 'Groceries'], ['Netto', '', 'Groceries'], ['Kaufland', '', 'Groceries'],
  ['Seldi Lebensmittel', 'Asian store', 'Groceries'], ['Nashed Markt', 'Asian store', 'Groceries'], ['Asia Shop Indian Store', 'Asian store', 'Groceries'], ['Asian Store', 'Asian store', 'Groceries'],
  ['Flink', 'Online groceries', 'Groceries'],
  ['Lieferando', '', 'Takeout'], ['UberEats', '', 'Takeout'], ['Wolt', '', 'Takeout'], ['Lunch', 'Eating out', 'Eating out'],
  ['DM', 'Drugstore', 'Household'], ['Rossmann', 'Drugstore', 'Household'],
  ['Uber', '', 'Transport'], ['PlayStation', '', 'Fun & games'],
  ['Amazon', 'Online shopping', 'Online shopping'], ['Joybuy', 'Online shopping', 'Online shopping'], ['DHL', 'Post', 'Post & shipping']

const lc = s => String(s || '').trim().toLowerCase();
function upgrade(s) {
  if ((+s.v || 1) >= 3) return s;
  const st = s.settings;
  const have = new Map((st.categories || []).map(c => [lc(c.name), c]));
  const cats = DEFAULT_CATS.map(([n, b]) => have.get(lc(n)) || { name: n, budget: !!b });
  (st.categories || []).forEach(c => { if (!cats.includes(c)) cats.push(c); });
  st.categories = cats.filter(c => lc(c.name) !== 'other').concat(cats.filter(c => lc(c.name) === 'other'));
  if (!Array.isArray(st.shops)) {
    st.shops = DEFAULT_SHOPS.map(([name, group, cat]) => ({ name, group, cat }));
    (st.stores || []).forEach(n => { if (!st.shops.some(x => lc(x.name) === lc(n))) st.shops.push({ name: n, group: /asian/i.test(n) ? 'Asian store' : '', cat: /asian|turkish/i.test(n) ? 'Groceries' : '' }); });
  }
  st.mainBank = st.mainBank || 'Deutsche Bank'; st.spendBank = st.spendBank || 'Revolut'; if (st.buffer == null) st.buffer = 100;
  const DBRX = /rent|miete|electric|strom|kaution|internet|liabil|haftpfl|radio|rundfunk/i;
  s.items.forEach(i => { if (!i.bank) i.bank = DBRX.test(i.name) ? 'main' : 'spend'; });
  s.incomes.forEach(i => { if (!i.bank) i.bank = 'main'; });
  if (!s.transfers || typeof s.transfers !== 'object') s.transfers = {};

}

const groupOf = name => { const m = findShop(name); return m ? (m.group || m.name) : (String(name || '').trim() || 'Other'); };

/* ---------------------- payday plan (main bank -> spending account) ---------------------- */
function planTarget() { const c = curCycle(); return daysBetween(todayISO(), c.next) <= 7 ? shiftCycle(c, 1) : c; }
function planFor(c, balance) {
  const r = compute(c);
  const isMain = b => b === 'main';
  const mainBills = r.bills.filter(b => isMain(b.it.bank));
  const spendBills = r.bills.filter(b => !isMain(b.it.bank));
  const mainIn = r.incomes.filter(i => (i.inc.bank || 'main') === 'main');
  const spendIn = r.incomes.filter(i => (i.inc.bank || 'main') !== 'main');
  const buffer = +S.settings.buffer || 0;
  const hasBal = balance !== '' && balance != null && !isNaN(balance);
  const keepFor = r2(hasBal ? sum(mainBills.filter(b => !b.paid), b => b.amount) : sum(mainBills, b => b.amount));
  const heldMain = heldIn('main'), heldSpend = heldIn('spend');
  const send = r2(hasBal ? balance - keepFor - buffer - heldMain : sum(mainIn, i => i.amount) - keepFor);
  const spendBillsSum = r2(sum(spendBills, b => b.amount));
  const kitchen = r.budget;
  const free = r2(Math.max(0, send) + sum(spendIn, i => i.amount) - spendBillsSum - kitchen);
  const saveSug = free > 100 ? Math.floor(free * 0.5 / 50) * 50 : 0;
  return { r, c, mainBills, spendBills, mainIn, spendIn, buffer, heldMain, heldSpend, keepFor, send, hasBal, spendBillsSum, kitchen, free, saveSug, done: (S.transfers || {})[c.key] };
}
function planCardHTML(force) {
  const c = planTarget(), cur = curCycle(), p = planFor(c), isNext = c.key !== cur.key;
  if (!force && !isNext && (p.done || compute(cur).dayIdx > 10)) return '';
  if (p.done) return `<article class="card plan click" data-act="plan" data-k="${c.key}" style="margin-bottom:18px"><div class="eyebrow">Payday plan · ${esc(c.label)}</div><div class="smallnum" style="margin-top:6px">✓ ${money(p.done.amount)} sent to ${esc(bankName('spend'))}</div><div class="muted">on ${fmtD(p.done.date)}${p.done.who ? ' by ' + esc(p.done.who) : ''}</div></article>`;
  return `<article class="card plan click" data-act="plan" data-k="${c.key}" style="margin-bottom:18px">

  for (const it of S.items) if (isFinished(it) && !it.freedShown) {
    it.freedShown = true; Sync.save();
    showOverlay(chainsSVG(), 'Last installment paid!', `${esc(it.name)} ended on ${fmtD(it.end, true)}. ${money(it.amount)} a month is free again.`); break;
  }
}

/* ---------------------- actions ---------------------- */
const ACT = {
  fab: () => entryForm(),
  tips: () => { const T = tips(); openModal('💡 Little lightbulbs', T.length ? `<div class="rows">${T.map(t => `<div class="rowsimple" style="align-items:flex-start"><span style="font-size:22px">${t.i}</span><div class="grow">${esc(t.t)}</div></div>`).join('')}</div>` : '<p>No tips right now. All looks in order.</p>'); },
  dismiss: d => { const x = dismissed(); x.push(d.id); localStorage.setItem(LS_DISMISS, JSON.stringify(x.slice(-200))); render(true); },
  paid: d => { const m = S.paid[d.ck] = S.paid[d.ck] || {}; if (m[d.pid]) delete m[d.pid]; else m[d.pid] = todayISO(); commit(); if (UI.pop) ACT.section({ id: UI.pop }); },
  tickDue: () => { const c = curCycle(), t = todayISO(); const m = S.paid[c.key] = S.paid[c.key] || {}; let n = 0;
    billsIn(c).forEach(b => { if ((b.date && b.date <= t) && !m[b.pid]) { m[b.pid] = t; n++; } }); commit(); toast('✅', n ? `${plural(n, 'item')} ticked as paid.` : 'Nothing dated before today was left unticked. Undated items stay for you to tick by hand.'); },
  section: d => {
    const s = S.sections.find(x => x.id === d.id); if (!s) return; const c = curCycle(), r = compute(c);
    const its = S.items.filter(i => i.section === s.id && !isFinished(i));
    openModal(`${s.emoji || ''} ${esc(s.name)}`, `<div class="rows">${its.map(it => { const bs = r.bills.filter(b => b.it.id === it.id);
      return `<div class="rowsimple ${it.paused ? 'row off' : ''}" style="display:flex">${datebox(bs[0] ? bs[0].date : null)}<div class="grow"><b style="font-weight:500">${esc(it.name)}</b>${itemTags(it)}<br><small class="muted">${esc(describe(it))}</small></div>
        <div class="amt">${money(it.amount)}</div>${bs.length ? paidBtn(c.key, bs[0].pid, bs[0].paid) : '<small class="muted" style="min-width:52px;text-align:center">not this cycle</small>'}<button class="ibtn" data-act="editItem" data-id="${it.id}">✎</button></div>`; }).join('') || '<p class="muted">Empty page.</p>'}</div>
      <dl class="ledger" style="margin-top:14px">${line('Due this cycle', -sum(r.bills.filter(b => b.it.section === s.id), b => b.amount))}${line('Monthly average', -sum(its, monthlyEq), 'dim')}</dl>
      <div class="form-actions"><button class="btn sm" data-act="editSection" data-id="${s.id}">Rename page</button><span class="spacer"></span><button class="btn primary sm" data-act="addItem" data-section="${s.id}">+ Add item</button></div>`, 'wide');
    UI.pop = s.id;
  },
  addItem: d => itemForm(null, d.section),
  editItem: d => itemForm(S.items.find(i => i.id === d.id)),
  delItem: d => delItem(d.id),
  addSection: () => formModal({ title: 'New page', fields: [{ k: 'name', label: 'Name', req: true, wide: true }, { k: 'emoji', label: 'Emoji', ph: '📁' }], onSubmit: v => { S.sections.push({ id: uid(), name: v.name, emoji: v.emoji || '📁' }); commit(); } }),
  editSection: d => { const s = S.sections.find(x => x.id === d.id);
    formModal({ title: 'Edit page', values: s, fields: [{ k: 'name', label: 'Name', req: true, wide: true }, { k: 'emoji', label: 'Emoji' }],
      extra: [{ label: 'Delete page', cls: 'danger', onClick: () => { const n = S.items.filter(i => i.section === s.id).length;
        if (S.sections.length < 2) { toast('✋', 'Keep at least one page.'); return; }
        confirmBox(`Delete <b>${esc(s.name)}</b>${n ? ` and its ${plural(n, 'item')}` : ''}?`, 'Delete', () => { S.sections = S.sections.filter(x => x.id !== s.id); S.items = S.items.filter(i => i.section !== s.id); commit(); }); } }],
      onSubmit: v => { Object.assign(s, { name: v.name, emoji: v.emoji || '📁' }); commit(); } }); },
  editBudget: () => formModal({ title: 'Kitchen budget', values: { b: S.settings.groceryBudget }, fields: [{ k: 'b', label: 'Monthly budget for groceries + takeout (€)', type: 'money', req: true, wide: true }], onSubmit: v => { S.settings.groceryBudget = v.b; commit(); } }),
  addIncome: () => incomeForm(null, false),
  addOwed: () => incomeForm(null, true),
  editIncome: d => incomeForm(S.incomes.find(i => i.id === d.id)),
  delIncome: d => { const i = S.incomes.find(x => x.id === d.id); confirmBox(`Delete <b>${esc(i.name)}</b>?`, 'Delete', () => { S.incomes = S.incomes.filter(x => x.id !== d.id); commit(); }); },
  received: d => { const i = S.incomes.find(x => x.id === d.id); i.received = true; i.receivedOn = todayISO(); commit(); toast('🤝', `${money(i.amount)} received and added to this cycle.`); },
  saveMoney: d => formModal({ title: d.t === 'in' ? '🪙 Add to savings' : 'Take money out', values: { date: todayISO(), amount: d.amt || '', note: d.amt ? 'Payday savings' : '' },
    fields: [{ k: 'amount', label: 'Amount (€)', type: 'money', req: true }, { k: 'date', label: 'Date', type: 'date' }, { k: 'note', label: 'Note', wide: true, ph: d.t === 'in' ? 'e.g. October leftover' : 'e.g. car repair' }],
    onSubmit: v => { if (!(v.amount > 0)) return false; const amt = d.t === 'in' ? v.amount : -v.amount;
      S.savings.balance = r2(+S.savings.balance + amt); S.savings.log.push({ id: uid(), date: v.date || todayISO(), amount: amt, note: v.note }); commit();
      toast(amt > 0 ? '🪙' : '💸', amt > 0 ? `${money(amt)} dropped into the gullak.` : `${money(-amt)} taken out.`); checkEgg(); } }),
  delLog: d => { const l = S.savings.log.find(x => x.id === d.id); confirmBox(`Undo this ${l.amount > 0 ? 'deposit' : 'withdrawal'} of ${money(Math.abs(l.amount))}?`, 'Undo', () => { S.savings.balance = r2(+S.savings.balance - l.amount); S.savings.log = S.savings.log.filter(x => x.id !== d.id); commit(); }); },
  editEgg: () => formModal({ title: 'Safety egg', values: { m: S.settings.emergencyMonths, b: S.savings.balance }, fields: [{ k: 'm', label: 'Months of essentials to cover', type: 'number', step: '1', min: 1, max: 24 }, { k: 'b', label: 'Correct total savings (€)', type: 'money', hint: 'Only if the balance is wrong.' }],
    onSubmit: v => { S.settings.emergencyMonths = +v.m || 3; if (v.b !== '' && !isNaN(v.b) && v.b !== +S.savings.balance) { S.savings.log.push({ id: uid(), date: todayISO(), amount: r2(v.b - S.savings.balance), note: 'Balance correction' }); S.savings.balance = v.b; } commit(); checkEgg(); } }),
  addGoal: () => ACT.editGoal({}),
  editGoal: d => { const g = S.goals.find(x => x.id === d.id);
    formModal({ title: g ? 'Edit goal' : 'New goal', values: g || { emoji: '🎯' }, fields: [{ k: 'name', label: 'Name', req: true }, { k: 'emoji', label: 'Emoji' }, { k: 'target', label: 'Target (€)', type: 'money' }, { k: 'by', label: 'Reach it by', type: 'date' }, { k: 'note', label: 'Note', type: 'textarea', wide: true }],
      onSubmit: v => { const data = { name: v.name, emoji: v.emoji || '🎯', target: isNaN(v.target) ? 0 : v.target, by: v.by, note: v.note }; if (g) Object.assign(g, data); else S.goals.push({ id: uid(), ...data }); commit(); } }); },
  delGoal: d => confirmBox('Delete this goal?', 'Delete', () => { S.goals = S.goals.filter(x => x.id !== d.id); commit(); }),
  addEvent: () => ACT.editEvent({}),
  editEvent: d => { const ev = S.events.find(x => x.id === d.id);
    formModal({ title: ev ? 'Edit reminder' : 'New reminder', values: ev || { repeat: 'yearly', lead: 30, emoji: '📌' }, fields: [{ k: 'name', label: 'What', req: true, wide: true }, { k: 'emoji', label: 'Emoji' }, { k: 'repeat', label: 'Repeats', type: 'select', options: [['yearly', 'Every year'], ['once', 'Once']] }, { k: 'date', label: 'Date', type: 'date', req: true }, { k: 'lead', label: 'Remind me this many days before', type: 'number', step: '1', min: 0 }, { k: 'note', label: 'Note', type: 'textarea', wide: true }],
      onSubmit: v => { const data = { name: v.name, emoji: v.emoji || '📌', repeat: v.repeat, date: v.date, lead: +v.lead || 0, note: v.note }; if (ev) Object.assign(ev, data); else S.events.push({ id: uid(), ...data }); commit(); } }); },
  delEvent: d => confirmBox('Delete this reminder?', 'Delete', () => { S.events = S.events.filter(x => x.id !== d.id); commit(); }),
  editChild: () => formModal({ title: 'Child', values: { n: S.settings.childName, b: S.settings.childBirth }, fields: [{ k: 'n', label: 'Name', req: true }, { k: 'b', label: 'Birth date', type: 'date' }], onSubmit: v => { S.settings.childName = v.n; S.settings.childBirth = v.b; commit(); } }),
  editEntry: d => entryForm(E.find(e => e.id === d.id)),
  delEntry: d => { const e = E.find(x => x.id === d.id); confirmBox(`Delete ${money(e.amount)} at ${esc(e.store)}?`, 'Delete', async () => { await Sync.deleteEntry(d.id); render(true); }); },
  pickStore: d => { const i = $('#kform [name=store]'); if (i) { i.value = d.v; autoCatIn($('#kform'), d.v); $$('#kform .chip[data-act=pickStore]').forEach(c => c.classList.toggle('on', c.dataset.v === d.v)); } },
  kOff: d => { UI.kOff = Math.min(0, d.n === '0' ? 0 : UI.kOff + (+d.n)); render(true); },
  pieMode: d => { UI.pieMode = d.v; render(true); },
  pieScope: d => { UI.pieScope = d.v; render(true); },
  closeCycle: () => closeCycleModal(),
  bank: d => { const it = S.items.find(i => i.id === d.id); if (!it) return; it.bank = it.bank === 'main' ? 'spend' : 'main'; it.bankSet = true; commit(); if (UI.pop) ACT.section({ id: UI.pop }); toast('🏦', `${esc(it.name)} is now paid from ${esc(bankName(it.bank))}.`); },
  plan: d => planModal(d.k),
  banks: () => banksModal(),
  setBank: d => { const arr = d.kind === 'inc' ? S.incomes : d.kind === 'held' ? (S.held || []) : S.items; const x = arr.find(i => i.id === d.id); if (!x) return; x.bank = d.b; x.bankSet = true; Sync.save(); $$(`[data-seg="${d.id}"] button`).forEach(b => b.classList.toggle('on', b.dataset.b === d.b)); UI.needRender = true; },
  addHeld: () => heldForm(),
  editHeld: d => heldForm((S.held || []).find(h => h.id === d.id)),
  planDone: d => { S.transfers[d.k] = { amount: +d.amt || 0, date: todayISO(), who: who() }; commit(); planModal(d.k); toast('💸', `Marked ${money(+d.amt || 0)} as sent to ${esc(bankName('spend'))}.`); },
  planUndo: d => { delete S.transfers[d.k]; commit(); planModal(d.k); },
  planSave: d => { closeModal(); ACT.saveMoney({ t: 'in', amt: d.amt }); },
  wrapped: d => { closeModal(); openWrapped(d.k); },
  wnext: () => wShow(WR.i + 1), wprev: () => wShow(WR.i - 1), wclose: () => closeWrapped(), wreplay: () => wShow(0),
  shops: () => shopsModal(),
  settings: () => settingsModal(),
  copyLink: async () => { const l = location.origin + location.pathname + '#key=' + encodeURIComponent(Sync.key);
    try { await navigator.clipboard.writeText(l); toast('🔗', 'Share link copied. Anyone with it can view and edit.'); } catch (e) { prompt('Copy this link:', l); } },
  exportData: () => { const b = new Blob([JSON.stringify({ state: S, entries: E }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `kharcha-backup-${todayISO()}.json`; a.click(); },
  importData: () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text()); if (!j.state) throw 0;
      confirmBox('Replace everything with this backup? Purchases in the backup are added.', 'Import', async () => { S = migrate(j.state); Sync.save(); const have = new Set(E.map(e => e.id));
        for (const e of (j.entries || [])) if (!have.has(e.id)) await Sync.addEntry({ spent_on: e.spent_on, store: e.store, amount: e.amount, category: e.category, note: e.note, who: e.who }); render(true); toast('📦', 'Backup imported.'); });
    } catch (e) { toast('⚠️', 'That file is not a Kharcha backup.'); } }; i.click(); }
};
function settingsModal() {
  const st = S.settings;
  const m = formModal({
    title: '⚙ Settings', cls: 'wide',
    values: { n1: st.names[0], n2: st.names[1] || '', sd: st.salaryDay, gb: st.groceryBudget, em: st.emergencyMonths, cn: st.childName, cb: st.childBirth, mb: st.mainBank, rb: st.spendBank, buf: st.buffer, cats: st.categories.map(c => c.name + (c.budget ? '*' : '')).join(', ') },
    fields: [{ k: 'n1', label: 'Person 1', req: true }, { k: 'n2', label: 'Person 2' }, { k: 'sd', label: 'Payday (day of month; starts each cycle)', type: 'number', step: '1', min: 1, max: 31 },
      { k: 'gb', label: 'Kitchen budget (€/month)', type: 'money' }, { k: 'em', label: 'Safety egg: months of essentials', type: 'number', step: '1', min: 1 },
      { k: 'cn', label: "Child's name" }, { k: 'cb', label: "Child's birth date", type: 'date' },
      { k: 'mb', label: 'Bank for salary and fixed bills' }, { k: 'rb', label: 'Bank for daily spending' }, { k: 'buf', label: 'Safety buffer left in the first bank (€)', type: 'money' },
      { k: 'cats', label: 'Purchase categories (comma separated; * = counts toward kitchen budget)', type: 'textarea', wide: true }],
    onSubmit: v => {
      st.names = [v.n1, v.n2].filter(Boolean); st.salaryDay = clamp(+v.sd || 23, 1, 31); st.groceryBudget = isNaN(v.gb) ? st.groceryBudget : v.gb;
      st.emergencyMonths = +v.em || 3; st.childName = v.cn || 'Child'; st.childBirth = v.cb;
      st.mainBank = v.mb || st.mainBank; st.spendBank = v.rb || st.spendBank; if (!isNaN(v.buf) && v.buf !== '') st.buffer = v.buf;
      const cats = v.cats.split(',').map(s => s.trim()).filter(Boolean).map(s => ({ name: s.replace(/\*$/, '').trim(), budget: /\*$/.test(s) }));
      if (cats.length) st.categories = cats;
      const sal = S.incomes.find(i => i.id === 'salary'); if (sal && sal.freq === 'monthly') sal.day = st.salaryDay;
      commit();
    }
  });
  const box = document.createElement('div'); box.className = 'field wide';
  box.innerHTML = `<div style="border-top:3px double rgba(42,31,23,.25);margin:6px 0 4px;padding-top:12px"><h3 style="font-size:21px">Sharing & sync</h3>
    ${Sync.mode === 'cloud' ? `<p>Connected to Supabase <span class="syncdot ${Sync.lastErr ? 'error' : 'ok'}"></span>. Changes reach both phones within seconds.</p><button type="button" class="btn sm" data-act="copyLink">🔗 Copy share link for ${esc(st.names[1] || 'your partner')}</button>`
      : CONFIG.SUPABASE_URL ? `<p>Supabase is configured, but this device has no household key yet. Open your share link (…#key=…) or paste the key:</p><div style="display:flex;gap:8px"><input id="hkey" placeholder="household key"><button type="button" class="btn sm" id="hkeyb">Connect</button></div>`
      : `<p class="muted">Running on this device only. Add your Supabase URL and key at the top of <code>index.html</code> to share with ${esc(st.names[1] || 'your partner')}.</p>`}
    ${Sync.lastErr ? `<p class="neg">Last error: ${esc(Sync.lastErr)}</p>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="btn sm" data-act="banks">🏦 Which account pays what</button><button type="button" class="btn sm" data-act="shops">🏪 Shops & groups</button><button type="button" class="btn sm" data-act="exportData">⬇ Download backup</button><button type="button" class="btn sm" data-act="importData">⬆ Import backup</button></div></div>`;
  $('form', m).insertBefore(box, $('.form-actions', m));
  const kb = $('#hkeyb', m); if (kb) kb.onclick = () => { const k = $('#hkey', m).value.trim(); if (k) { localStorage.setItem(LS_KEY, k); location.reload(); } };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-close]'); if (!t) return;
  if (t.hasAttribute('data-close')) { closeModal(); return; }
  if (t.dataset.tab) { closeModal(); go(t.dataset.tab); return; }
  const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset, t); }
});
document.addEventListener('keydown', e => {
  if ($('#wrapped').classList.contains('open')) { if (e.key === 'Escape') closeWrapped(); else if (e.key === 'ArrowRight' || e.key === ' ') wShow(WR.i + 1); else if (e.key === 'ArrowLeft') wShow(WR.i - 1); return; }
  if (e.key === 'Escape') { closeModal(); $('#overlay').classList.remove('open'); }
});
document.addEventListener('input', e => { const t = e.target; if (t && t.name === 'store' && t.form) autoCatIn(t.form, t.value); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'kform') return; e.preventDefault();
  const f = e.target, amount = parseAmount(f.amount.value);
  if (!(amount > 0)) { toast('✏️', 'Enter an amount first.'); f.amount.focus(); return; }
  const entry = { amount, store: f.store.value.trim() || 'Other', category: f.category.value || S.settings.categories[0].name, spent_on: f.spent_on.value || todayISO(), who: f.who.value || who(), note: f.note.value.trim() };
  localStorage.setItem(LS_WHO, entry.who);
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  const before = compute(curCycle()); const row = await Sync.addEntry(entry); btn.disabled = false;
  if (row) { document.activeElement && document.activeElement.blur(); afterAdd(row, before); }
});

/* ---------------------- start ---------------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async function start() {
  await Sync.init();
  if (MIGRATED) { MIGRATED = false; if (Sync.mode !== 'cloud') saveLocal(); }
  render(true);
  if (pendingClose()) setTimeout(closeCycleModal, 700);
  else { checkFinished(); checkEgg(); }
  const key = 'kharcha.toasted.' + todayISO();
  if (!sessionStorage.getItem(key)) { sessionStorage.setItem(key, '1'); reminders().filter(r => r.d <= 7).slice(0, 2).forEach((r, i) => setTimeout(() => toast(r.icon, `<b>${esc(r.title)}</b><br>${esc(r.sub)}`, 8000), 900 + i * 700)); }
  setInterval(() => { if (!$('#modal-root').classList.contains('open')) render(); }, 30 * 60 * 1000);
})();
</script>
</body>
</html>
