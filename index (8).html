<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha · household ledger</title>
<meta name="theme-color" content="#6e1d18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%236e1d18'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23d9b25c' stroke='%23f3e3c3' stroke-width='3'/%3E%3Ctext x='32' y='41' font-size='24' text-anchor='middle' fill='%236e1d18' font-family='Georgia'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Noto+Nastaliq+Urdu:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#efe4cc; --sheet:#fbf6ea; --sheet2:#f4ecda; --ink:#2a1f17; --ink2:#5a4a3c; --muted:#8a7764;
  --red:#8e2a22; --cover:#6e1d18; --gold:#a97a24; --gold2:#d9b25c; --green:#2e5e45; --indigo:#2b3a67;
  --turmeric:#c98f22; --rule:#cfdae2; --margin:#d98b85; --clay:#b5603a;
  --shadow:0 1px 0 rgba(42,31,23,.07), 0 10px 26px -14px rgba(42,31,23,.45);
  --r:7px;
  --serif:'EB Garamond', Garamond, 'Times New Roman', serif;
  --fell:'IM Fell English', 'EB Garamond', Georgia, serif;
  --sc:'IM Fell English SC', 'EB Garamond', Georgia, serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.45;
  font-variant-numeric:lining-nums tabular-nums; min-height:100vh;
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .24 0 0 0 0 .13 0 0 0 .07 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--fell);font-weight:400;margin:0;letter-spacing:.2px}
button{font-family:inherit}
a{color:var(--indigo)}
.muted{color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)}
.hidden{display:none!important}

/* ---------- cover / header ---------- */
.cover{
  color:#f3e3c3; position:sticky; top:0; z-index:30;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 5px),
    linear-gradient(180deg,#7c231c,#5c1712);
  border-bottom:4px double var(--gold2);
  box-shadow:0 6px 18px -10px rgba(0,0,0,.6);
}
.cover-inner{max-width:1180px;margin:0 auto;padding:12px 20px 4px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{width:44px;height:44px;flex:none}
.brand h1{font-size:34px;line-height:1;color:#f7e8c6}
.brand .urdu{font-family:'Noto Nastaliq Urdu',serif;font-size:21px;color:var(--gold2);line-height:1.2;margin-top:-6px}
.brand .sub{font-family:var(--fell);font-style:italic;font-size:14px;opacity:.78;white-space:nowrap}
.brand-txt{display:flex;flex-direction:column}
.brand-top{display:flex;align-items:baseline;gap:10px}
.today{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid rgba(217,178,92,.55);border-radius:999px;font-size:15px;background:rgba(0,0,0,.15);white-space:nowrap}
.pill b{color:#ffe7a8;font-weight:600}
.pill.alert{background:#f3e3c3;color:var(--red);border-color:#f3e3c3;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,90%,100%{transform:none}93%{transform:rotate(-3deg)}96%{transform:rotate(3deg)}}
.head-actions{display:flex;gap:6px;align-items:center}
.hbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(217,178,92,.6);background:rgba(0,0,0,.18);color:#f3e3c3;font-size:18px;cursor:pointer;display:grid;place-items:center}
.hbtn:hover{background:rgba(0,0,0,.3)}
.hbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--gold2);color:var(--cover);font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.bulb.lit{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,214,120,.25),0 0 18px rgba(255,214,120,.6)}}
.syncdot{width:10px;height:10px;border-radius:50%;background:#bba68a;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.syncdot.ok{background:#7fc28f}.syncdot.syncing{background:var(--gold2);animation:blink 1s infinite}.syncdot.error{background:#ff7b6b}
@keyframes blink{50%{opacity:.3}}

.tabs{max-width:1180px;margin:0 auto;padding:6px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid rgba(217,178,92,.45);border-bottom:none;background:rgba(0,0,0,.18);color:#f3e3c3;font-family:var(--sc);font-size:16px;letter-spacing:.04em;padding:7px 16px 6px;border-radius:8px 8px 0 0;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab:hover{background:rgba(0,0,0,.3)}
.tab.on{background:var(--paper);color:var(--cover);border-color:var(--gold2)}
.tab .ti{font-size:16px}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 20px 110px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:grid;gap:18px;align-content:start}
section{margin-bottom:18px}
.section-title{font-size:26px;margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-title small{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.section-title::after{content:'';flex:1;border-bottom:3px double rgba(42,31,23,.25);min-width:40px;transform:translateY(-6px)}

.card{background:var(--sheet);border:1px solid rgba(42,31,23,.17);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;position:relative;min-width:0}
.card.click{cursor:pointer;transition:transform .15s, box-shadow .15s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(42,31,23,.07),0 16px 30px -14px rgba(42,31,23,.5)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h2{font-size:23px}
.card-head .sp{flex:1}
.eyebrow{font-family:var(--sc);letter-spacing:.07em;color:var(--red);font-size:14.5px}
.label{font-family:var(--sc);letter-spacing:.05em;color:var(--ink2);font-size:14px}
.bignum{font-family:var(--fell);font-size:clamp(46px,7vw,74px);line-height:1;margin:2px 0}
.midnum{font-family:var(--fell);font-size:34px;line-height:1.05}
.smallnum{font-family:var(--fell);font-size:24px}

/* hero */
.hero{overflow:hidden}
.hero::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--red),var(--gold2),var(--red))}
.hero-row{display:flex;gap:14px;align-items:center;margin:8px 0 6px}
.hero-fig{width:170px;flex:none}
.hero-fig svg{width:100%;height:auto;display:block}
.mood-cap{font-family:var(--fell);font-style:italic;font-size:19px;color:var(--ink2)}
.daybar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:6px 0 4px}
.daybar .bar{flex:1}

/* ledger lines */
.ledger{margin:12px 0 0;padding:8px 0 0 30px;position:relative;
  background-image:linear-gradient(transparent 29px, var(--rule) 29px);background-size:100% 30px}
.ledger::before{content:'';position:absolute;left:18px;top:0;bottom:0;border-left:1.5px solid var(--margin)}
.ll{display:flex;align-items:flex-end;height:30px;gap:8px}
.ll dt{flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ll .lead{flex:1;border-bottom:1px dotted rgba(42,31,23,.35);transform:translateY(-6px)}
.ll dd{margin:0;font-weight:500}
.ll.dim{color:var(--muted)}
.ledger-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--ink);margin-top:4px;padding-top:6px;position:relative;font-family:var(--fell);font-size:21px}
.ledger-total::after{content:'';position:absolute;left:0;right:0;top:3px;border-top:1px solid var(--ink)}
.ledger-total dd{margin:0}

/* bars */
.bar{position:relative;height:13px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(42,31,23,.07) 9px 10px)}
.bar.thin{height:8px;border-width:1px}
.bar>i{display:block;height:100%;background:var(--green);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar>i.warn{background:var(--turmeric)} .bar>i.bad{background:var(--red)} .bar>i.gold{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar-legend{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:4px}

/* buttons, chips */
.btn{font:inherit;font-size:15.5px;padding:7px 14px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:5px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{background:#fffaf0}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.btn.primary{background:var(--green);color:#f8f0dc;border-color:#1b3a29;box-shadow:2px 2px 0 #1b3a29}
.btn.red{background:var(--red);color:#f8f0dc;border-color:#561711;box-shadow:2px 2px 0 #561711}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:3px 10px;font-size:14.5px;box-shadow:1.5px 1.5px 0 var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{border:none;background:none;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:4px;color:var(--ink2)}
.ibtn:hover{background:rgba(42,31,23,.08)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid rgba(42,31,23,.3);border-radius:999px;background:var(--sheet);cursor:pointer;font-size:15px;user-select:none;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip.on,.chip:has(input:checked){background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--sheet);padding:4px 11px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--sheet)}

.stamp{display:inline-block;font-family:var(--sc);color:var(--red);border:2px solid var(--red);padding:0 6px;transform:rotate(-7deg);font-size:12.5px;letter-spacing:.12em;border-radius:3px;line-height:1.5;opacity:.88;background:rgba(142,42,34,.04)}
.paidbtn{border:1.5px dashed rgba(42,31,23,.35);background:transparent;border-radius:4px;cursor:pointer;font-size:12.5px;font-family:var(--sc);letter-spacing:.08em;color:var(--muted);padding:1px 7px;min-width:52px}
.paidbtn:hover{border-color:var(--ink);color:var(--ink)}
.paidbtn.done{border:none;padding:0}
.tag{display:inline-block;font-size:12.5px;font-family:var(--sc);letter-spacing:.05em;padding:0 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.chain{color:var(--indigo)} .tag.up{color:var(--red)} .tag.end{color:var(--gold)} .tag.paused{color:var(--muted)}

/* stats */
.stat .midnum{margin-top:4px}
.stat .muted{font-size:14.5px}

/* section cards */
.sec{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.sec .emo{font-size:30px;line-height:1}
.sec h3{font-size:21px}
.sec .sec-amt{font-family:var(--fell);font-size:28px}
.sec .corner{position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold));opacity:.18}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.5fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none}
.row .nm{font-weight:500}
.row .sch{font-size:14.5px;color:var(--ink2)}
.row .amt{font-family:var(--fell);font-size:19px;text-align:right;white-space:nowrap}
.row .act{display:flex;gap:2px;justify-content:flex-end}
.row.off{opacity:.5}
.rowsimple{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.rowsimple:last-child{border-bottom:none}
.rowsimple .grow{flex:1;min-width:0}
.rowsimple .amt{font-family:var(--fell);font-size:19px;white-space:nowrap}
.datebox{width:46px;flex:none;text-align:center;border:1px solid rgba(42,31,23,.3);border-radius:5px;background:#fffdf6;line-height:1.05;padding:3px 0}
.datebox b{display:block;font-family:var(--fell);font-size:20px;font-weight:400}
.datebox span{font-family:var(--sc);font-size:11.5px;color:var(--red);letter-spacing:.06em}
.soon{color:var(--red);font-weight:600}

/* reminders */
.reminders{display:grid;gap:10px;margin-bottom:18px}
.rem{display:flex;gap:12px;align-items:center;background:#fff7e3;border:1px solid var(--gold2);border-left:6px solid var(--gold);border-radius:6px;padding:10px 14px;box-shadow:var(--shadow);animation:slidein .5s both}
.rem.hot{border-left-color:var(--red);background:#fdf0e6}
.rem .ri{font-size:24px}
.rem .grow{flex:1;min-width:0}
.rem small{color:var(--ink2)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}

/* kitchen */
.jar-wrap{width:150px;flex:none}
.jar-wrap.small{width:92px}
.jar-wrap svg{width:100%;height:auto;display:block}
.km-row{display:flex;gap:14px;align-items:center;margin:4px 0 10px}
.amount-in{font-family:var(--fell);font-size:40px;width:100%;border:none;border-bottom:2px solid var(--ink);background:transparent;padding:2px 0 2px 26px;color:var(--ink);outline:none}
.amount-wrap{position:relative}
.amount-wrap::before{content:'€';position:absolute;left:0;bottom:8px;font-family:var(--fell);font-size:30px;color:var(--muted)}
.kform{display:grid;gap:14px}
.kform .r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:190px;height:190px;flex:none}
.legend{flex:1;min-width:180px;display:grid;gap:5px}
.legend div{display:flex;gap:8px;align-items:center;font-size:15px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.legend .lv{margin-left:auto;font-family:var(--fell);font-size:17px;white-space:nowrap}
.legend .lp{color:var(--muted);width:42px;text-align:right;font-size:13.5px}
.daygroup{font-family:var(--sc);font-size:14px;letter-spacing:.06em;color:var(--red);margin:12px 0 2px;display:flex;justify-content:space-between}
.cyclenav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cyclenav h2{font-size:26px}
.cyclenav .muted{font-style:italic}

/* money */
.gullak-wrap{width:140px;flex:none}
.egg-wrap{width:120px;flex:none}
.egg-wrap.small{width:60px}
.gullak-wrap svg,.egg-wrap svg{width:100%;height:auto;display:block}

/* history */
.chart svg{width:100%;height:auto;display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:15.5px}
.tbl th{font-family:var(--sc);font-weight:400;letter-spacing:.05em;color:var(--ink2);text-align:right;padding:6px 8px;border-bottom:1.5px solid var(--ink)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tblwrap{overflow-x:auto}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field[hidden]{display:none}
.field>label,.flabel{font-family:var(--sc);font-size:13.5px;letter-spacing:.05em;color:var(--ink2)}
.field small{color:var(--muted);font-size:13px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:8px 10px;border:1px solid rgba(42,31,23,.35);border-radius:5px;background:#fffdf6;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:16px;letter-spacing:0;color:var(--ink)}
.check input{width:auto}
.form-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.form-actions .spacer{flex:1}

/* modal */
#modal-root{position:fixed;inset:0;z-index:60;display:none}
#modal-root.open{display:grid;place-items:center}
.modal-back{position:absolute;inset:0;background:rgba(30,18,10,.48);backdrop-filter:blur(2px)}
.modal{position:relative;width:min(600px,94vw);max-height:88vh;overflow:auto;background:var(--sheet);border:1px solid rgba(42,31,23,.3);border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(820px,94vw)}
.modal::before{content:'';display:block;height:6px;background:linear-gradient(90deg,var(--red),var(--gold2),var(--red));border-radius:10px 10px 0 0}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 20px 4px}
.modal-head h3{font-size:25px;flex:1}
.modal-head .x{border:none;background:none;font-size:28px;cursor:pointer;color:var(--ink2);line-height:1}
.modal-body{padding:8px 20px 20px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}

/* toasts */
#toasts{position:fixed;right:18px;top:96px;z-index:70;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#f6ecd6;padding:11px 14px;border-radius:7px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);display:flex;gap:10px;align-items:flex-start;animation:toastin .3s both;font-size:15.5px}
.toast .ti{font-size:20px;line-height:1.1}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateX(30px)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}

/* overlay celebrations */
#overlay{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,236,190,.95),rgba(239,228,204,.97) 60%);cursor:pointer}
#overlay.open{display:grid;animation:fade .3s}
#overlay .ov{text-align:center;padding:20px;max-width:560px}
#overlay svg{width:min(380px,86vw);height:auto}
#overlay h2{font-size:clamp(30px,6vw,46px);color:var(--red);margin-top:6px}
#overlay p{font-size:19px;color:var(--ink2);margin:6px 0 0}
#overlay small{display:block;margin-top:14px;color:var(--muted);font-style:italic}
@keyframes fade{from{opacity:0}}

/* FAB */

<script>
'use strict';
/* =====================================================================
   1. CONFIG: paste your Supabase Project URL and publishable (anon) key.
      These two values are safe to publish. The household key is NOT here:
      it travels in your share link (#key=...) and is stored per device.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',   // e.g. 'https://abcdefgh.supabase.co'
  SUPABASE_KEY: ''    // e.g. 'sb_publishable_...' or the legacy 'anon public' key
};

/* ---------------------- helpers ---------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1, 12); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const ymDate = (y, m, day) => { const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return iso(new Date(yy, mm, Math.min(day, dim(yy, mm)), 12)); };
const sum = (a, f = x => x) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const parseAmount = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? r2(n) : NaN; };
function money(n, { sign = false, dec = 2 } = {}) {
  const v = r2(n); const s = Math.abs(v).toLocaleString('en-IE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return (v < 0 ? '−' : (sign && v > 0 ? '+' : '')) + '€' + s;
}
function fmtD(s, year) {
  if (!s) return '';
  const d = parse(s); const y = d.getFullYear() !== new Date().getFullYear() || year;
  return `${d.getDate()} ${MON[d.getMonth()]}${y ? ' ' + d.getFullYear() : ''}`;
}
const fmtLong = s => parse(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const hashStr = s => { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const PALETTE = ['#8e2a22','#2e5e45','#c98f22','#2b3a67','#a0522d','#6d8b5e','#c76b3d','#6d4c7d','#3f6e7a','#9c7a3c','#b0465a','#4f5d2f'];

/* ---------------------- state ---------------------- */
let S = null, E = [];
const LS_STATE = 'kharcha.state', LS_ENTRIES = 'kharcha.entries', LS_KEY = 'kharcha.key', LS_WHO = 'kharcha.who', LS_DISMISS = 'kharcha.dismiss';
const UI = { tab: localStorage.getItem('kharcha.tab') || 'overview', kOff: 0, pieMode: 'store', pieScope: 'cycle', lastJar: null, needRender: false, pop: null };
const SD = () => (S && S.settings && +S.settings.salaryDay) || 23;

function seed() {
  const it = (section, name, amount, o = {}) => ({ id: uid(), section, name, amount, freq: 'monthly', day: null, kind: 'regular', history: [], ...o });
  return {
    v: 1,
    settings: {
      names: ['Jaffar', 'Iqra'], salaryDay: 23, groceryBudget: 500, emergencyMonths: 3,
      childName: 'Musa', childBirth: '', startCycle: cycleFor(todayISO()).key,
      categories: [
        { name: 'Groceries', budget: true }, { name: 'Takeout', budget: true },
        { name: 'Household', budget: false }, { name: 'Baby', budget: false }, { name: 'Other', budget: false }
      ],
      stores: ['Lidl','Rewe','Aldi','Edeka','Penny','Netto','Kaufland','Lieferando','DM','Rossmann','Asian store','Turkish store']
    },
    sections: [
      { id: 'apt', name: 'Apartment', emoji: '🏠' },
      { id: 'per', name: 'Insurance, tax & subscriptions', emoji: '📮' },
      { id: 'jaf', name: "Jaffar's costs", emoji: '🧔🏽' },
      { id: 'iqr', name: "Iqra's costs", emoji: '🌸' }
    ],
    items: [
      it('apt', 'Rent', 1045, { day: 25 }),
      it('apt', 'Electricity', 85, { kind: 'contract', note: 'One-year contract, renews in August. Switch provider early each year.' }),
      it('apt', 'Mietkaution', 7, { day: 15 }),
      it('apt', 'Internet', 48, { day: 16, kind: 'contract', end: '2027-09-30', note: 'Contract ends September 2027.' }),
      it('per', 'Liability insurance', 12.3, { freq: 'quarterly', anchor: '2026-08-15' }),
      it('per', 'Radio tax (Rundfunkbeitrag)', 55.08, { freq: 'quarterly', anchor: '2026-10-15' }),
      it('per', 'Netflix', 3.5, { day: 20 }),
      it('per', 'Amazon Prime', 4.5, { day: 2 }),
      it('jaf', 'Jaffar phone bill', 5, { day: 22 }),
      it('jaf', 'Gym', 52),
      it('jaf', 'Sadqa', 75),
      it('jaf', 'Amazon installments', 55.8, { kind: 'installment', note: 'Split into one line per installment and set each last-payment date.' }),
      it('iqr', 'Apple Pay', 3),
      it('iqr', 'Iqra phone', 25, { kind: 'contract', note: 'Set the end date when the contract expires.' }),
      it('iqr', 'Insurance', 267, { note: 'Price rises sometimes; edit the amount and the change is logged.' }),
      it('iqr', 'Pocket money', 103),
      it('iqr', 'Dental insurance', 12)
    ],
    incomes: [{ id: 'salary', name: 'Salary', amount: 3230, freq: 'monthly', day: 23, kind: 'income', emoji: '💼' }],
    savings: { balance: 0, log: [] },
    goals: [{ id: uid(), name: 'Family car', emoji: '🚗', target: 0, by: '', note: '' }],
    events: [
      { id: uid(), name: 'Nebenkosten statement from the landlady', emoji: '🧾', repeat: 'yearly', date: '2027-07-01', lead: 30, note: 'Usually arrives around July. Check the balance; a back-payment may be due.' },
      { id: uid(), name: 'Switch electricity provider', emoji: '⚡', repeat: 'yearly', date: '2027-08-01', lead: 60, note: 'One-year contract renews in August. Compare offers in June and cancel in time.' },
      { id: uid(), name: 'Internet contract ends', emoji: '📶', repeat: 'once', date: '2027-09-30', lead: 120, note: 'Compare offers and check the notice period in the contract.' }
    ],
    paid: {}, cycles: {}, flags: {}
  };
}
function migrate(st) {
  const d = seed();
  const s = Object.assign({}, d, st || {});
  s.settings = Object.assign({}, d.settings, (st && st.settings) || {});
  for (const k of ['sections','items','incomes','goals','events']) if (!Array.isArray(s[k])) s[k] = d[k];
  s.savings = Object.assign({ balance: 0, log: [] }, s.savings || {});
  for (const k of ['paid','cycles','flags']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  s.items.forEach(i => { if (!i.history) i.history = []; if (!i.kind) i.kind = 'regular'; });
  return s;
}
const normEntry = e => ({ id: e.id, spent_on: String(e.spent_on).slice(0, 10), store: e.store || 'Other', amount: +e.amount || 0, category: e.category || 'Groceries', note: e.note || '', who: e.who || '', created_at: e.created_at || '' });
function saveLocal() { try { localStorage.setItem(LS_STATE, JSON.stringify(S)); localStorage.setItem(LS_ENTRIES, JSON.stringify(E)); } catch (e) {} }
function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_STATE) || 'null'); S = migrate(s); } catch (e) { S = seed(); }
  try { E = (JSON.parse(localStorage.getItem(LS_ENTRIES) || '[]') || []).map(normEntry); } catch (e) { E = []; }
}
const who = () => localStorage.getItem(LS_WHO) || S.settings.names[0];

/* ---------------------- sync ---------------------- */
const Sync = {
  client: null, key: '', mode: 'local', channel: null, timer: null, pending: false, lastErr: '',
  device: localStorage.getItem('kharcha.device') || (() => { const d = uid(); localStorage.setItem('kharcha.device', d); return d; })(),
  async init() {
    const m = location.hash.match(/key=([^&]+)/);
    if (m) { localStorage.setItem(LS_KEY, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
    this.key = localStorage.getItem(LS_KEY) || '';
    loadLocal();
    if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY && window.supabase && this.key) {
      this.client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: false } });
      this.mode = 'cloud';
      await this.pull();
      this.listen();
    } else this.status('local');
  },
  status(s, msg) {
    const d = $('#syncdot'); if (!d) return;
    d.className = 'syncdot ' + s; this.lastErr = msg || '';
    d.title = { local: 'Saved on this device only', ok: 'Synced with Supabase', syncing: 'Syncing…', error: 'Sync error: ' + (msg || '') }[s];
  },
  async pull() {
    if (this.mode !== 'cloud' || this.pending) return false;
    this.status('syncing');
    const { data, error } = await this.client.rpc('kharcha_load', { p_key: this.key });
    if (error) { this.status('error', error.message); toast('⚠️', 'Could not load from Supabase: ' + esc(error.message)); return false; }
    const st = data && data.state && data.state.data;
    if (st && Object.keys(st).length) S = migrate(st); else await this.pushState();
    E = ((data && data.entries) || []).map(normEntry);
    saveLocal(); this.status('ok'); return true;
  },
  save() {
    saveLocal();
    if (this.mode !== 'cloud') return;
    this.pending = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.pushState(), 600);
  },
  async pushState() {
    this.status('syncing');
    const { error } = await this.client.rpc('kharcha_save_state', { p_key: this.key, p_data: S, p_who: who() });
    this.pending = false;
    if (error) { this.status('error', error.message); toast('⚠️', 'Not saved to Supabase: ' + esc(error.message)); return; }
    this.status('ok'); this.ping();
  },
  async addEntry(e) {
    if (this.mode === 'cloud') {
      this.status('syncing');
      const { data, error } = await this.client.rpc('kharcha_add_entry', { p_key: this.key, p_entry: e });
      if (error) { this.status('error', error.message); toast('⚠️', 'Not saved: ' + esc(error.message)); return null; }
      const row = normEntry(data); E.push(row); saveLocal(); this.status('ok'); this.ping(); return row;
    }
    const row = normEntry({ ...e, id: uid(), created_at: new Date().toISOString() }); E.push(row); saveLocal(); return row;
  },
  async updateEntry(id, patch) {
    if (this.mode === 'cloud') {
      const { data, error } = await this.client.rpc('kharcha_update_entry', { p_key: this.key, p_id: id, p_entry: patch });
      if (error) { this.status('error', error.message); toast('⚠️', 'Not saved: ' + esc(error.message)); return false; }
      const i = E.findIndex(x => x.id === id); if (i > -1 && data) E[i] = normEntry(data); saveLocal(); this.ping(); return true;
    }
    const i = E.findIndex(x => x.id === id); if (i > -1) E[i] = normEntry({ ...E[i], ...patch }); saveLocal(); return true;
  },
  async deleteEntry(id) {
    if (this.mode === 'cloud') {
      const { error } = await this.client.rpc('kharcha_delete_entry', { p_key: this.key, p_id: id });
      if (error) { this.status('error', error.message); toast('⚠️', 'Not deleted: ' + esc(error.message)); return false; }

function vDates() {
  const t = todayISO(), cb = S.settings.childBirth;
  const MS = [{ m: 12, t: 'Legal right to a Kita place from the 1st birthday (§24 SGB VIII)' }, { m: 36, t: 'Kindergarten age; the Kita entitlement runs until school starts' }, { m: 72, t: 'School entry age in NRW (children who turn 6 by 30 September start that year)' }];
  let child = `<p>Add ${esc(S.settings.childName)}'s birth date to see his age, birthday countdown and milestones.</p>`;
  if (cb) { const a = ageOf(cb); const nb = nextEventDate({ date: cb, repeat: 'yearly' }, t);
    child = `<div class="midnum">${esc(ageText(a))}</div><p class="muted" style="margin:2px 0 10px">Born ${fmtD(cb, true)} · next birthday in ${plural(daysBetween(t, nb), 'day')} (${fmtD(nb, true)})</p>
      <div class="rows">${MS.map(x => { const d = (() => { const b = parse(cb); return ymDate(b.getFullYear(), b.getMonth() + x.m, b.getDate()); })(); const done = d <= t;
        return `<div class="rowsimple"><span style="font-size:20px">${done ? '✔️' : '⏳'}</span><div class="grow">${esc(x.t)}<br><small class="muted">${fmtD(d, true)}${done ? '' : ` · in ${plural(monthsUntil(d), 'month')}`}</small></div></div>`; }).join('')}</div>`; }
  const tl = upcoming(t, addDays(t, 365)).filter(u => u.kind !== 'income' || !S.incomes.find(i => i.name === u.name && i.freq === 'monthly'))
    .filter(u => u.kind !== 'bill' || everyOf(u.it) > 1 || u.it.freq === 'once' || (u.it.end && u.date === u.it.end) || (u.it.end && u.date >= addDays(u.it.end, -31)));
  for (const it of S.items) if (it.end && it.end >= t && it.end <= addDays(t, 365) && it.kind === 'contract') tl.push({ date: it.end, name: `${it.name} contract ends`, kind: 'event', emoji: '📝' });
  if (cb) { const nb = nextEventDate({ date: cb, repeat: 'yearly' }, t); if (nb <= addDays(t, 365)) tl.push({ date: nb, name: `${S.settings.childName}'s birthday`, kind: 'event', emoji: '🎂' }); }
  tl.sort((a, b) => a.date < b.date ? -1 : 1);
  const byMonth = {}; tl.forEach(u => { const k = u.date.slice(0, 7); (byMonth[k] = byMonth[k] || []).push(u); });
  return `
  <section class="grid g2e">
    <article class="card"><div class="card-head"><span style="font-size:28px">👶🏽</span><h2>${esc(S.settings.childName)}</h2><span class="sp"></span><button class="btn sm" data-act="editChild">Edit</button></div>${child}</article>

      <div class="rows">${S.events.map(ev => { const n = nextEventDate(ev, t); return `<div class="rowsimple">${datebox(n)}<div class="grow">${ev.emoji || '📌'} ${esc(ev.name)}<br><small class="muted">${ev.repeat === 'yearly' ? 'every year' : 'once'} · reminder ${ev.lead || 30} days before${n ? ` · ${fmtD(n, true)}` : ''}</small></div>
        <button class="ibtn" data-act="editEvent" data-id="${ev.id}">✎</button><button class="ibtn" data-act="delEvent" data-id="${ev.id}">🗑</button></div>`; }).join('') || '<p class="muted">None yet.</p>'}</div></article>
  </section>
  <h2 class="section-title">The year ahead <small>periodic bills, contract ends, installments and dates</small></h2>
  <article class="card">${Object.keys(byMonth).length ? Object.entries(byMonth).map(([k, list]) => { const [y, m] = k.split('-').map(Number);
    return `<div class="daygroup"><span>${MONTHS[m - 1]} ${y}</span><span>${money(-sum(list.filter(u => u.amount < 0), u => u.amount))}</span></div>${upList(list, false)}`; }).join('') : '<p class="muted">Nothing in the next 12 months.</p>'}</article>`;
}

function vHistory() {
  const cur = curCycle(), pend = pendingClose();
  const keys = Object.keys(S.cycles).sort();
  const rows = keys.map(k => ({ k, label: cycleFromKey(k).label, ...S.cycles[k], proj: false }));
  const rc = compute(cur);
  rows.push({ k: cur.key, label: cur.label + ' (so far)', income: rc.incomeTotal, bills: rc.billsTotal, kitchen: rc.kitchenSpent, other: rc.otherSpent, leftover: rc.leftover, saved: sum(S.savings.log.filter(l => l.date >= cur.start), l => l.amount), proj: true });
  const max = Math.max(1, ...rows.map(r => Math.abs(r.leftover || 0)), ...rows.map(r => Math.abs(r.saved || 0)));
  const neg = rows.some(r => r.leftover < 0); const base = neg ? 100 : 150, sc = (neg ? 80 : 130) / max; const W = Math.max(360, rows.length * 90);
  const chart = `<svg viewBox="0 0 ${W} 190">${rows.map((r, i) => { const x = i * 90 + 18, h = (r.leftover || 0) * sc, hs = Math.max(0, r.saved || 0) * sc;
    return `<rect x="${x}" y="${h >= 0 ? base - h : base}" width="30" height="${Math.abs(h)}" fill="${h >= 0 ? '#2e5e45' : '#8e2a22'}" opacity="${r.proj ? .55 : 1}"><title>${esc(r.label)} leftover ${money(r.leftover)}</title></rect>
      <rect x="${x + 34}" y="${base - hs}" width="22" height="${hs}" fill="#d9b25c" stroke="#a97a24"><title>saved ${money(r.saved || 0)}</title></rect>
      <text x="${x + 28}" y="${base + (neg ? 80 : 22)}" text-anchor="middle" font-family="IM Fell English SC" font-size="13" fill="#5a4a3c">${MON[cycleFromKey(r.k).m]} ${String(cycleFromKey(r.k).y).slice(2)}</text>`; }).join('')}
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#2a1f17"/></svg>`;
  let cum = 0; const pts = S.savings.log.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(l => ({ d: l.date, v: (cum += l.amount) }));
  const smax = Math.max(1, ...pts.map(p => p.v)); const sW = 600;
  const sline = pts.length > 1 ? `<svg viewBox="0 0 ${sW} 140"><polyline fill="none" stroke="#a97a24" stroke-width="3" points="${pts.map((p, i) => `${(i / (pts.length - 1) * (sW - 20) + 10).toFixed(1)},${(128 - p.v / smax * 110).toFixed(1)}`).join(' ')}"/>

  addEvent: () => ACT.editEvent({}),
  editEvent: d => { const ev = S.events.find(x => x.id === d.id);
    formModal({ title: ev ? 'Edit reminder' : 'New reminder', values: ev || { repeat: 'yearly', lead: 30, emoji: '📌' }, fields: [{ k: 'name', label: 'What', req: true, wide: true }, { k: 'emoji', label: 'Emoji' }, { k: 'repeat', label: 'Repeats', type: 'select', options: [['yearly', 'Every year'], ['once', 'Once']] }, { k: 'date', label: 'Date', type: 'date', req: true }, { k: 'lead', label: 'Remind me this many days before', type: 'number', step: '1', min: 0 }, { k: 'note', label: 'Note', type: 'textarea', wide: true }],
      onSubmit: v => { const data = { name: v.name, emoji: v.emoji || '📌', repeat: v.repeat, date: v.date, lead: +v.lead || 0, note: v.note }; if (ev) Object.assign(ev, data); else S.events.push({ id: uid(), ...data }); commit(); } }); },
  delEvent: d => confirmBox('Delete this reminder?', 'Delete', () => { S.events = S.events.filter(x => x.id !== d.id); commit(); }),
  editChild: () => formModal({ title: 'Child', values: { n: S.settings.childName, b: S.settings.childBirth }, fields: [{ k: 'n', label: 'Name', req: true }, { k: 'b', label: 'Birth date', type: 'date' }], onSubmit: v => { S.settings.childName = v.n; S.settings.childBirth = v.b; commit(); } }),
  editEntry: d => entryForm(E.find(e => e.id === d.id)),
  delEntry: d => { const e = E.find(x => x.id === d.id); confirmBox(`Delete ${money(e.amount)} at ${esc(e.store)}?`, 'Delete', async () => { await Sync.deleteEntry(d.id); render(true); }); },
  pickStore: d => { const i = $('#kform [name=store]'); if (i) { i.value = d.v; $$('#kform .chip[data-act=pickStore]').forEach(c => c.classList.toggle('on', c.dataset.v === d.v)); } },
  kOff: d => { UI.kOff = Math.min(0, d.n === '0' ? 0 : UI.kOff + (+d.n)); render(true); },
  pieMode: d => { UI.pieMode = d.v; render(true); },
  pieScope: d => { UI.pieScope = d.v; render(true); },
  closeCycle: () => closeCycleModal(),
  settings: () => settingsModal(),
  copyLink: async () => { const l = location.origin + location.pathname + '#key=' + encodeURIComponent(Sync.key);
    try { await navigator.clipboard.writeText(l); toast('🔗', 'Share link copied. Anyone with it can view and edit.'); } catch (e) { prompt('Copy this link:', l); } },
  exportData: () => { const b = new Blob([JSON.stringify({ state: S, entries: E }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `kharcha-backup-${todayISO()}.json`; a.click(); },
  importData: () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text()); if (!j.state) throw 0;
      confirmBox('Replace everything with this backup? Purchases in the backup are added.', 'Import', async () => { S = migrate(j.state); Sync.save(); const have = new Set(E.map(e => e.id));
        for (const e of (j.entries || [])) if (!have.has(e.id)) await Sync.addEntry({ spent_on: e.spent_on, store: e.store, amount: e.amount, category: e.category, note: e.note, who: e.who }); render(true); toast('📦', 'Backup imported.'); });
    } catch (e) { toast('⚠️', 'That file is not a Kharcha backup.'); } }; i.click(); }
};
function settingsModal() {
  const st = S.settings;
  const m = formModal({
    title: '⚙ Settings', cls: 'wide',
    values: { n1: st.names[0], n2: st.names[1] || '', sd: st.salaryDay, gb: st.groceryBudget, em: st.emergencyMonths, cn: st.childName, cb: st.childBirth, stores: st.stores.join(', '), cats: st.categories.map(c => c.name + (c.budget ? '*' : '')).join(', ') },
    fields: [{ k: 'n1', label: 'Person 1', req: true }, { k: 'n2', label: 'Person 2' }, { k: 'sd', label: 'Payday (day of month; starts each cycle)', type: 'number', step: '1', min: 1, max: 31 },
      { k: 'gb', label: 'Kitchen budget (€/month)', type: 'money' }, { k: 'em', label: 'Safety egg: months of essentials', type: 'number', step: '1', min: 1 },
      { k: 'cn', label: "Child's name" }, { k: 'cb', label: "Child's birth date", type: 'date' },
      { k: 'stores', label: 'Shop shortcuts (comma separated)', type: 'textarea', wide: true },
      { k: 'cats', label: 'Purchase categories (comma separated; * = counts toward kitchen budget)', type: 'textarea', wide: true }],
    onSubmit: v => {
      st.names = [v.n1, v.n2].filter(Boolean); st.salaryDay = clamp(+v.sd || 23, 1, 31); st.groceryBudget = isNaN(v.gb) ? st.groceryBudget : v.gb;
      st.emergencyMonths = +v.em || 3; st.childName = v.cn || 'Child'; st.childBirth = v.cb;
      st.stores = v.stores.split(',').map(s => s.trim()).filter(Boolean);
      const cats = v.cats.split(',').map(s => s.trim()).filter(Boolean).map(s => ({ name: s.replace(/\*$/, '').trim(), budget: /\*$/.test(s) }));
      if (cats.length) st.categories = cats;
      const sal = S.incomes.find(i => i.id === 'salary'); if (sal && sal.freq === 'monthly') sal.day = st.salaryDay;
      commit();
    }
  });
  const box = document.createElement('div'); box.className = 'field wide';
  box.innerHTML = `<div style="border-top:3px double rgba(42,31,23,.25);margin:6px 0 4px;padding-top:12px"><h3 style="font-size:21px">Sharing & sync</h3>
    ${Sync.mode === 'cloud' ? `<p>Connected to Supabase <span class="syncdot ${Sync.lastErr ? 'error' : 'ok'}"></span>. Changes reach both phones within seconds.</p><button type="button" class="btn sm" data-act="copyLink">🔗 Copy share link for ${esc(st.names[1] || 'your partner')}</button>`
      : CONFIG.SUPABASE_URL ? `<p>Supabase is configured, but this device has no household key yet. Open your share link (…#key=…) or paste the key:</p><div style="display:flex;gap:8px"><input id="hkey" placeholder="household key"><button type="button" class="btn sm" id="hkeyb">Connect</button></div>`
      : `<p class="muted">Running on this device only. Add your Supabase URL and key at the top of <code>index.html</code> to share with ${esc(st.names[1] || 'your partner')}.</p>`}
    ${Sync.lastErr ? `<p class="neg">Last error: ${esc(Sync.lastErr)}</p>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="btn sm" data-act="exportData">⬇ Download backup</button><button type="button" class="btn sm" data-act="importData">⬆ Import backup</button></div></div>`;
  $('form', m).insertBefore(box, $('.form-actions', m));
  const kb = $('#hkeyb', m); if (kb) kb.onclick = () => { const k = $('#hkey', m).value.trim(); if (k) { localStorage.setItem(LS_KEY, k); location.reload(); } };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-close]'); if (!t) return;
  if (t.hasAttribute('data-close')) { closeModal(); return; }
  if (t.dataset.tab) { closeModal(); go(t.dataset.tab); return; }
  const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset, t); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#overlay').classList.remove('open'); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'kform') return; e.preventDefault();
  const f = e.target, amount = parseAmount(f.amount.value);
  if (!(amount > 0)) { toast('✏️', 'Enter an amount first.'); f.amount.focus(); return; }
  const entry = { amount, store: f.store.value.trim() || 'Other', category: f.category.value || S.settings.categories[0].name, spent_on: f.spent_on.value || todayISO(), who: f.who.value || who(), note: f.note.value.trim() };
  localStorage.setItem(LS_WHO, entry.who);
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  const before = compute(curCycle()); const row = await Sync.addEntry(entry); btn.disabled = false;
  if (row) { document.activeElement && document.activeElement.blur(); afterAdd(row, before); }
});

/* ---------------------- start ---------------------- */
(async function start() {
  await Sync.init();
  render(true);
  if (pendingClose()) setTimeout(closeCycleModal, 700);
  else { checkFinished(); checkEgg(); }
  const key = 'kharcha.toasted.' + todayISO();
  if (!sessionStorage.getItem(key)) { sessionStorage.setItem(key, '1'); reminders().filter(r => r.d <= 7).slice(0, 2).forEach((r, i) => setTimeout(() => toast(r.icon, `<b>${esc(r.title)}</b><br>${esc(r.sub)}`, 8000), 900 + i * 700)); }
  setInterval(() => { if (!$('#modal-root').classList.contains('open')) render(); }, 30 * 60 * 1000);
})();
</script>
</body>
</html>
